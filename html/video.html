	<body class="lesson-page layout-cinema">
		<div id="backgroundBlur"></div>

		<div class="lesson-shell">
			<aside class="sidebar">
				<div class="sidebar-flip-scene">
					<div class="sidebar-flip-card" id="sidebarFlip">
						<div class="sidebar-flip-face sidebar-flip-front glass">
							<div class="pane-body">
								<div id="leftAccordion"></div>
								<div class="account-box" id="accountBox"></div>
							</div>
						</div>
						<div class="sidebar-flip-face sidebar-flip-back glass">
							<div class="pane-body">
								<div class="settings-pane">
									<div class="settings-pane-main">
										<div id="settingsHomeView">
											<div class="sidebar-head brand-head settings-head">
												<div class="sidebar-icon">⚙️</div>
												<div><h2 id="settingsTitle">Configurações</h2></div>
											</div>
											<ul class="topic-nav">
												<li><a href="#" id="settingsMyData" class="settingsNavClick"><span class="nav-ico">●</span><span class="settings-link-label" data-k="myData">Meus dados</span></a></li>
												<li><a href="#" id="settingsMyPurchases" class="settingsNavClick"><span class="nav-ico">●</span><span class="settings-link-label" data-k="myPurchases">Minhas compras</span></a></li>
												<li><a href="#" id="settingsBackgrounds" class="settingsNavClick"><span class="nav-ico">●</span><span class="settings-link-label" data-k="backgrounds">Cores de fundo</span></a></li>
												<li><a href="#" id="settingsIdioma" class="settingsNavClick"><span class="nav-ico">●</span><span class="settings-link-label" data-k="idioma">Idioma</span></a></li>
											</ul>
											<button type="button" class="account-btn account-btn-ghost settings-logout" id="accountLogout">Deslogar</button>
										</div>
									</div>
									<div class="account-box settings-footer">
										<button type="button" class="account-btn" id="accountSettingsBack">Voltar</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</aside>

			<div class="center-col">
				<div class="lesson-align">
					<div id="previousAndNextVideo"></div>
					<main class="stage">
					<div class="flip-scene">
						<div class="flip-card" id="lessonFlip">
							<div class="flip-face flip-front glass" id="box">
							<div id="name" class="text"></div>
							<div class="player-frame">
							<div id="video"></div>
							<div class="player-tools">
								<button type="button" class="player-tool" id="toggleCinema" title="Modo cinema" aria-label="Modo cinema" aria-pressed="false">
									<svg viewBox="0 0 36 36" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="m 28,11 0,14 -20,0 0,-14 z m -18,2 16,0 0,10 -16,0 0,-10 z"/></svg>
								</button>
								<button type="button" class="player-tool" id="toggleFullscreen" title="Tela cheia" aria-label="Tela cheia" aria-pressed="false">
									<svg viewBox="0 0 36 36" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="m 10,16 2,0 0,-4 4,0 0,-2 L 10,10 l 0,6 0,0 z"/><path fill="#fff" fill-rule="evenodd" d="m 20,10 0,2 4,0 0,4 2,0 L 26,10 l -6,0 0,0 z"/><path fill="#fff" fill-rule="evenodd" d="m 24,24 -4,0 0,2 L 26,26 l 0,-6 -2,0 0,4 0,0 z"/><path fill="#fff" fill-rule="evenodd" d="M 12,20 10,20 10,26 l 6,0 0,-2 -4,0 0,-4 0,0 z"/></svg>

							</div>
							</div>
							<div id="description" class="text"></div>
							<div id="links" class="text"></div>
						</div>
						<div class="flip-face flip-back glass">
							<h2 class="idioma-title">Idioma</h2>
							<p class="idioma-hint">Escolha o idioma da vitrine</p>
							<div class="idioma-choices">
								<button type="button" id="portugueseVersion" class="lang-pill">🇧🇷 Versão em português</button>
								<button type="button" id="englishVersion" class="lang-pill">🇺🇸 English version</button>
							</div>
						</div>
					</div>
				</div>
					</main>
				</div>
			</div>

			<aside class="modules">
				<div class="modules-flip-scene">
					<div class="modules-flip-card" id="modulesFlip">
						<div class="modules-flip-face modules-flip-front glass">
							<div class="pane-body">
								<div class="training-switcher">
									<button type="button" id="trainingPickerBtn" class="sidebar-head brand-head" aria-haspopup="listbox" aria-expanded="false">
										<div class="sidebar-icon">🎓</div>
										<div>
											<h2 id="trainingPickerName"></h2>
											<p id="trainingPickerSinopse"></p>
										</div>
									</button>
									<ul id="trainingPickerList" class="training-picker-list" hidden></ul>
								</div>
								<div class="modules-title">Módulos</div>
								<div id="accordion"></div>
								<div class="account-box settings-footer">
									<button type="button" class="account-btn" id="swapTrainingBtn">Trocar treinamento</button>
								</div>
							</div>
						</div>
						<div class="modules-flip-face modules-flip-back glass">
							<div class="pane-body">
								<div class="settings-pane">
									<div class="settings-pane-main">
										<div class="sidebar-head brand-head settings-head">
											<div class="sidebar-icon">🎓</div>
											<div><h2 id="swapTrainingTitle">Trocar treinamento</h2></div>
										</div>
										<ul class="topic-nav">
											<li><a href="#" id="swapListTrainings" class="swapNavClick"><span class="nav-ico">●</span><span class="swap-link-label" data-k="list">Listar treinamentos</span></a></li>
											<li><a href="#" id="swapFavorites" class="swapNavClick"><span class="nav-ico">●</span><span class="swap-link-label" data-k="fav">Favoritos</span></a></li>
											<li><a href="#" id="swapPurchases" class="swapNavClick"><span class="nav-ico">●</span><span class="swap-link-label" data-k="buy">Compras</span></a></li>
											<li><a href="#" id="swapOrders" class="swapNavClick"><span class="nav-ico">●</span><span class="swap-link-label" data-k="orders">Lista de pedidos</span></a></li>
										</ul>
									</div>
									<div class="account-box settings-footer">
										<button type="button" class="account-btn" id="swapTrainingBack">Voltar</button>
									</div>
								</div>
							</div>
						</div>
					</div>
