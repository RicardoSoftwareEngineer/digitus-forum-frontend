<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Como funciona</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			background: transparent;
			color: #fff;
			font-family: "Segoe UI", Verdana, sans-serif;
		}
		.pad {
			padding: 28px 32px 48px;
			max-width: 720px;
		}
		h1 {
			margin: 0 0 12px;
			font-size: 28px;
			font-weight: 600;
			letter-spacing: -0.02em;
		}
		p {
			margin: 0 0 12px;
			color: rgba(255, 255, 255, 0.78);
			line-height: 1.55;
			font-size: 16px;
		}
		ol {
			margin: 0;
			padding-left: 20px;
			color: rgba(255, 255, 255, 0.78);
			line-height: 1.55;
			font-size: 16px;
		}
		li { margin-bottom: 8px; }
	</style>
</head>
<body>
	<div class="pad">
		<h1>Como funciona</h1>
		<p>Esqueleto da página do guru Java. Ricardo reescreve este HTML.</p>
		<ol>
			<li>Escolha um treinamento no menu da direita.</li>
			<li>Assista às aulas (gif + áudio).</li>
			<li>Gratuitos são públicos; pagos pedem conta e compra.</li>
		</ol>
	</div>
</body>
</html>
