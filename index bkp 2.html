$( document ).ready(function() {	

	debugToken ='15ae9480-4515-4041-a15d-56d7c11e3a1d'; 
	
	
	
	
	$('#createAccountButton').click(function() {
		window.location.href = "./html/createAccount.html";
	});
	
	$('#englishVersion, #usa').click(function() {
		$('#welcome').empty().append('Welcome, gurujava.com is a free programming education platform designed for beginners.');
		$('#inputPassword').attr("placeholder", "Password");
		$('#submitButton').attr("value", "Enter");
		$('#createAccountButton').attr("value", "Create account");
		$('#createAccountButton').css("width", "12vw");
		$('#createAccountButton').css("left", "24.3vw");
		$('#forgotPassword').attr("value", "Forgot password");
	});
	
	$('#portugueseVersion, #brazil').click(function() {
		$('#welcome').empty().append('Bem vindo, gurujava.com é uma plataforma de ensino gratuita de programação feita para iniciantes.');
		$('#inputPassword').attr("placeholder", "Senha");
		$('#submitButton').attr("value", "Entrar");
		$('#createAccountButton').attr("value", "Criar conta");
		$('#createAccountButton').css("width", "10vw");
		$('#createAccountButton').css("left", "25.5vw");
		$('#forgotPassword').attr("value", "Esqueci a senha");
	});
	
	$("#inputEmail").focus();
	
	// Attach a submit handler to the form
	$( "#loginForm not in use" ).submit(function( event ) {
	  // Stop form from submitting normally
	  event.preventDefault();
	  var $form = $( this ),
		email = $form.find( "input[name='inputEmail']" ).val(),
		password = $form.find( "input[name='inputPassword']" ).val(),
		//url = $form.attr( "action" );
		url = "";
		
		$.ajax({
			url: url,
			async: false,  
			type: 'POST',
			contentType: 'application/json',
			data: JSON.stringify({
				email:email,
				password:password
			}),
			dataType: 'json',
			success:function(xhr) {
				localStorage.setItem("token",  xhr.token);
				localStorage.setItem("tokenType",  xhr.tokenType);
				localStorage.setItem("perfilId",  xhr.lastPerfilUsed);
				localStorage.setItem("perfilType",  xhr.lastPerfilType);
				localStorage.setItem("perfilName",  xhr.lastPerfilName);
				window.location.href = "./html/video.html?video=16c2aa8f-a023-4bf4-adc2-4174c0a5de4a&course=bb610e6a-f196-40a4-b4a3-1b7b89b12155&module=db2f1119-0174-4b7b-bb3a-08bbd4156cbe&subject=null&screen=continueCurse";
			},
			error: function (xhr) {
				if(xhr.responseText == undefined){
					alert('server offline');
				}else{
					var err = JSON.parse(xhr.responseText);
					//alert(xhr.status);
					if(err.status == 404 || err.status == 403){
						alert('Usuário e/ou senha inválido(s)')
					}
				}
			}
		});
	});

});
